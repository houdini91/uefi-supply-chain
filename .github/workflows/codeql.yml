name: codeql-sast

# CodeQL SAST evidence (EVIDENCE-ROADMAP.md R2). Produces real SARIF:
#   * uploaded to the repository Security tab (the analyze step does this), and
#   * written to a known path + published as an artifact, so a LATER pipeline
#     step can attest the SARIF as a signed in-toto predicate.
#
# Two independent scan targets:
#   1. sast-python  — this repo's own Python supply-chain tooling (producers/reconcile/).
#                     No external checkout; runs on every push for a fast, always-
#                     green "we SAST our own tools" signal.
#   2. sast-edk2-c  — the pinned edk2 fork's firmware C, scoped to NetworkPkg via
#                     .github/codeql/codeql-config.yml. Heavier, so it is gated to
#                     workflow_dispatch and never blocks the quick Python result.
#
# All actions are pinned by commit SHA with a version comment (see supply-chain.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # least-privilege default; each job opts into exactly what it needs

jobs:
  # 1) SAST our own Python tooling. No external checkout -> immediate, reliable
  #    real evidence. build-mode:none (interpreted language, no build needed).
  sast-python:
    name: CodeQL — this repo's Python tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout this repo
      security-events: write   # upload SARIF to the Security tab
      actions: read            # read workflow run metadata (CodeQL best practice)
      id-token: write          # keyless OIDC signing of the SARIF (cosign / Fulcio)
      attestations: write      # emit the SARIF as signed evidence
    env:
      # cosign keyless cert identity = this workflow's ref (same shape as supply-chain.yml's BUILDER_ID).
      WORKFLOW_REF: https://github.com/${{ github.repository }}/.github/workflows/codeql.yml@${{ github.ref }}
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL (python)
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Analyze (python)
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:python"
          # Write the SARIF to a known path (in addition to the Security-tab upload)
          # so the attestation step below can consume it.
          output: sarif-results
          upload: always

      - name: Publish Python SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-python
          path: sarif-results/*.sarif
          if-no-files-found: error

      # ── SARIF as signed, gated evidence ─────────────────────────────────────
      # Mirrors supply-chain.yml's keyless cosign pattern: sign-blob --yes --bundle
      # over the produced SARIF, then verify-blob against this workflow's OIDC cert.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign the SARIF as signed evidence
        run: |
          set -euo pipefail
          for sarif in sarif-results/*.sarif; do
            echo "--- signing $sarif ---"
            # CodeQL names the file by language (e.g. python.sarif) -> bundle sits next to it.
            cosign sign-blob --yes --bundle "${sarif}.sig.bundle" "$sarif"
            cosign verify-blob \
              --certificate-identity "$WORKFLOW_REF" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "${sarif}.sig.bundle" "$sarif"
            echo "✓ $sarif keyless-signed + verified -> ${sarif}.sig.bundle"
          done

      - name: SAST severity gate (fail on high/critical)
        env:
          # Tunable threshold on CodeQL's CVSS-style `security-severity` (0.0–10.0):
          #   >= 7.0 = high, >= 9.0 = critical. Lower this to make the gate stricter.
          SAST_FAIL_SEVERITY: "7.0"
        run: |
          set -euo pipefail
          echo "SAST gate threshold: security-severity >= $SAST_FAIL_SEVERITY (7.0=high, 9.0=critical)"
          # jq -s slurps every SARIF file into one array so we are robust to >1 file.
          # Build ruleId -> security-severity (from tool.driver.rules AND tool.extensions[].rules),
          # join onto each result; rules without a security-severity are treated as 0 (skip).
          SUMMARY=$(jq -s --argjson thr "$SAST_FAIL_SEVERITY" '
            ( [ .[].runs[]
                | ( (.tool.driver.rules // []) + ( [ .tool.extensions[]?.rules[]? ] ) )
                | .[]
                | select(.id != null and (.properties["security-severity"] // "") != "")
                | { key: .id, value: (.properties["security-severity"] | tonumber) }
              ] | from_entries ) as $sev
            | [ .[].runs[].results[]? | ( $sev[.ruleId] // 0 ) ] as $scores
            | { total:              ($scores | length),
                critical:           ([ $scores[] | select(. >= 9.0) ]            | length),
                high:               ([ $scores[] | select(. >= 7.0 and . < 9.0) ]| length),
                medium:             ([ $scores[] | select(. >= 4.0 and . < 7.0) ]| length),
                low:                ([ $scores[] | select(. > 0   and . < 4.0) ] | length),
                unscored:           ([ $scores[] | select(. == 0) ]              | length),
                maxSeverity:        ($scores | max // 0),
                atOrAboveThreshold: ([ $scores[] | select(. >= $thr) ]           | length) }
          ' sarif-results/*.sarif)
          echo "--- SAST finding summary ---"
          echo "$SUMMARY" | jq .
          OVER=$(echo "$SUMMARY" | jq '.atOrAboveThreshold')
          if [ "$OVER" -gt 0 ]; then
            echo "::error::SAST gate FAILED: $OVER finding(s) at/above security-severity $SAST_FAIL_SEVERITY"
            exit 1
          fi
          echo "✓ SAST gate passed: no findings at/above security-severity $SAST_FAIL_SEVERITY"

  # 2) SAST the scoped edk2 firmware C. Checks out the pinned edk2 fork and runs
  #    CodeQL c-cpp with build-mode:none, scoped to NetworkPkg via the config file
  #    so it does not scan (or time out on) all of edk2. Gated to workflow_dispatch
  #    so the Python job above is always the fast, green quick result on push.
  sast-edk2-c:
    name: CodeQL — scoped edk2 firmware C (NetworkPkg)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write          # keyless OIDC signing of the SARIF (cosign / Fulcio)
      attestations: write      # emit the SARIF as signed evidence
    env:
      # cosign keyless cert identity = this workflow's ref (same shape as supply-chain.yml's BUILDER_ID).
      WORKFLOW_REF: https://github.com/${{ github.repository }}/.github/workflows/codeql.yml@${{ github.ref }}
      # edk2 source under test. Owner confirmed from DESIGN.md / engagement notes
      # (fork: houdini91/edk2). Tag edk2-stable202402 resolves to commit
      # edc6681206c1a8791981a2f911d2fb8b3d2f5768 (immutable stable tag).
      EDK2_REPO: houdini91/edk2
      EDK2_REF: edk2-stable202402
    steps:
      - name: Checkout the pinned edk2 fork (source under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.EDK2_REPO }}
          ref: ${{ env.EDK2_REF }}
          # NetworkPkg has no submodules of its own, so a shallow, submodule-free
          # checkout is enough and keeps the job fast.
          submodules: false
          persist-credentials: false

      - name: Initialize CodeQL (c-cpp, scoped via config)
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: c-cpp
          build-mode: none
          # paths: NetworkPkg + security-extended queries live in the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze (c-cpp)
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:c-cpp"
          output: sarif-results
          upload: always

      - name: Publish edk2 C SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-edk2-cpp
          path: sarif-results/*.sarif
          if-no-files-found: error

      # ── SARIF as signed, gated evidence ─────────────────────────────────────
      # Mirrors supply-chain.yml's keyless cosign pattern: sign-blob --yes --bundle
      # over the produced SARIF, then verify-blob against this workflow's OIDC cert.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign the SARIF as signed evidence
        run: |
          set -euo pipefail
          for sarif in sarif-results/*.sarif; do
            echo "--- signing $sarif ---"
            # CodeQL names the file by language (e.g. cpp.sarif) -> bundle sits next to it.
            cosign sign-blob --yes --bundle "${sarif}.sig.bundle" "$sarif"
            cosign verify-blob \
              --certificate-identity "$WORKFLOW_REF" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "${sarif}.sig.bundle" "$sarif"
            echo "✓ $sarif keyless-signed + verified -> ${sarif}.sig.bundle"
          done

      - name: SAST severity gate (fail on high/critical)
        env:
          # Tunable threshold on CodeQL's CVSS-style `security-severity` (0.0–10.0):
          #   >= 7.0 = high, >= 9.0 = critical. Lower this to make the gate stricter.
          SAST_FAIL_SEVERITY: "7.0"
        run: |
          set -euo pipefail
          echo "SAST gate threshold: security-severity >= $SAST_FAIL_SEVERITY (7.0=high, 9.0=critical)"
          # jq -s slurps every SARIF file into one array so we are robust to >1 file.
          # Build ruleId -> security-severity (from tool.driver.rules AND tool.extensions[].rules),
          # join onto each result; rules without a security-severity are treated as 0 (skip).
          SUMMARY=$(jq -s --argjson thr "$SAST_FAIL_SEVERITY" '
            ( [ .[].runs[]
                | ( (.tool.driver.rules // []) + ( [ .tool.extensions[]?.rules[]? ] ) )
                | .[]
                | select(.id != null and (.properties["security-severity"] // "") != "")
                | { key: .id, value: (.properties["security-severity"] | tonumber) }
              ] | from_entries ) as $sev
            | [ .[].runs[].results[]? | ( $sev[.ruleId] // 0 ) ] as $scores
            | { total:              ($scores | length),
                critical:           ([ $scores[] | select(. >= 9.0) ]            | length),
                high:               ([ $scores[] | select(. >= 7.0 and . < 9.0) ]| length),
                medium:             ([ $scores[] | select(. >= 4.0 and . < 7.0) ]| length),
                low:                ([ $scores[] | select(. > 0   and . < 4.0) ] | length),
                unscored:           ([ $scores[] | select(. == 0) ]              | length),
                maxSeverity:        ($scores | max // 0),
                atOrAboveThreshold: ([ $scores[] | select(. >= $thr) ]           | length) }
          ' sarif-results/*.sarif)
          echo "--- SAST finding summary ---"
          echo "$SUMMARY" | jq .
          OVER=$(echo "$SUMMARY" | jq '.atOrAboveThreshold')
          if [ "$OVER" -gt 0 ]; then
            echo "::error::SAST gate FAILED: $OVER finding(s) at/above security-severity $SAST_FAIL_SEVERITY"
            exit 1
          fi
          echo "✓ SAST gate passed: no findings at/above security-severity $SAST_FAIL_SEVERITY"
