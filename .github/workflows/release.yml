name: release

# Cut a keyless-signed GitHub Release. Tag the repo `vX.Y.Z` (or run manually) and this
# builds a reproducible source tarball, keyless-signs it with cosign (Sigstore/Fulcio —
# no long-lived key), and publishes the tarball + its signature, certificate, and Sigstore
# bundle as release assets. That makes the release independently verifiable:
#
#   cosign verify-blob \
#     --certificate uefi-supply-chain-<tag>.tar.gz.crt \
#     --signature   uefi-supply-chain-<tag>.tar.gz.sig \
#     --certificate-identity-regexp 'https://github.com/houdini91/uefi-supply-chain/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     uefi-supply-chain-<tag>.tar.gz
#
# It also generates SLSA build provenance (actions/attest-build-provenance) for the
# tarball and ships the in-toto bundle (<artifact>.intoto.jsonl) as a release asset, so
# consumers can verify what built the artifact and where:
#
#   gh attestation verify uefi-supply-chain-<tag>.tar.gz \
#     --repo houdini91/uefi-supply-chain
#
# That provenance is what takes OpenSSF Scorecard's Signed-Releases check from 8 → 10
# (signed + provenance). All actions pinned by commit SHA.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: build + keyless-sign + publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release + upload assets
      id-token: write      # OIDC for cosign keyless signing + provenance
      attestations: write  # store the SLSA build provenance attestation
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Build a reproducible source tarball
        run: |
          set -euo pipefail
          ART="uefi-supply-chain-${TAG}.tar.gz"
          # git archive is deterministic (no timestamps/uid) for a given tree.
          git archive --format=tar.gz --prefix="uefi-supply-chain-${TAG}/" -o "$ART" "$TAG"
          sha256sum "$ART" | tee "$ART.sha256"
          echo "ART=$ART" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Keyless-sign the tarball
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature   "$ART.sig" \
            --output-certificate "$ART.crt" \
            --bundle             "$ART.sigstore.json" \
            "$ART"
          # Self-verify before publishing so a broken signature never ships.
          cosign verify-blob \
            --certificate "$ART.crt" \
            --signature   "$ART.sig" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$ART"
          echo "✓ $ART keyless-signed + verified"

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ART }}

      - name: Stage provenance as a release asset
        run: |
          set -euo pipefail
          # attest-build-provenance writes the signed in-toto bundle to a temp path
          # (steps.provenance.outputs.bundle-path). Copy it next to the tarball with a
          # stable *.intoto.jsonl name so it can ship as a release asset — Scorecard's
          # Signed-Releases check inspects release assets and credits SLSA provenance,
          # taking the score from 8 → 10.
          cp "${{ steps.provenance.outputs.bundle-path }}" "$ART.intoto.jsonl"
          echo "✓ staged $ART.intoto.jsonl"

      - name: Publish the release with signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            "$ART" "$ART.sha256" "$ART.sig" "$ART.crt" "$ART.sigstore.json" "$ART.intoto.jsonl"
