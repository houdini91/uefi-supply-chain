name: scorecard-supply-chain

# OpenSSF Scorecard posture evidence (EVIDENCE-ROADMAP.md). Runs the Scorecard probes
# against this repo and:
#   * uploads the SARIF to the repository Security tab (code scanning alerts), and
#   * publishes the (non-secret) result to the OpenSSF API so the repo earns a public
#     Scorecard badge.
#
# IMPORTANT: Scorecard here is *posture evidence*, not a hard gate. There is deliberately
# NO score-threshold check — a low Scorecard score must never fail CI.
#
# PUBLISH RESTRICTIONS — do not "enrich" this job. To publish results the OpenSSF webapp
# re-verifies THIS workflow file (ossf/scorecard-action#workflow-restrictions), so the
# analysis job must stay minimal:
#   * NO workflow-level or job-level `env:` / `defaults:` (step-level env is fine),
#   * only the approved actions may appear in the job — actions/checkout,
#     ossf/scorecard-action, github/codeql-action/upload-sarif, actions/upload-artifact,
#     step-security/harden-runner (no `run:` steps, no cosign-installer, etc.),
#   * `id-token: write` may appear on NO other job in the file.
# Violate any of these and the publish POST 400s ("workflow verification failed") while the
# job still goes green — the badge then silently stays empty. (We previously signed the SARIF
# as keyless evidence here, codeql.yml-style; that broke publishing with a job-level env var +
# an unapproved cosign step. Nothing consumed that signature, so it was removed. If signed-SARIF
# evidence is ever wanted, do it in a SEPARATE workflow to keep this one publishable.)
#
# The weekly schedule matters: several Scorecard probes (e.g. Branch-Protection) and the
# publish signal expect scheduled runs. All actions are pinned by commit SHA.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Mondays at 07:17 UTC. Scheduled runs feed branch_protection & other checks.
    - cron: "17 7 * * 1"

permissions:
  contents: read   # least-privilege default; the job opts into exactly what it needs

jobs:
  scorecard-analysis:
    name: OpenSSF Scorecard — supply-chain posture evidence
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # OIDC: Scorecard publish_results (tokenless publish to the API)
      contents: read           # checkout this repo
      actions: read            # read workflow run metadata (Scorecard best practice)
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # Pin the COMMIT SHA (not the annotated-tag object SHA) — the publish webapp's
        # imposter-commit check resolves this as a commit in ossf/scorecard-action.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the result to the OpenSSF API so the repo earns a public Scorecard
          # badge (needs id-token: write). Tokenless — no PAT required for public repos.
          publish_results: true

      # Upload the SARIF to the repository Security tab (code scanning alerts).
      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
