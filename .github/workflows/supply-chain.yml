name: firmware-supply-chain

# Reference workflow: keyless-sign the firmware SBOM, verify it, and gate deployment on policy —
# every gate input derived from evidence (shared assembler), CVE scan run for real, and an
# in-pipeline negative test proving the gate blocks a post-sign tamper.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # least-privilege default; each job opts into more

jobs:
  attest-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # keyless OIDC signing (this job only)
      packages: write        # push the SBOM to ghcr for the cosign-native policy demo (feature b)
      attestations: write    # actions/attest-build-provenance (platform-generated SLSA provenance)
    env:
      PRED_TYPE: https://firmware-sbom-supplychain/reconcile/v1
      BUILDER_ID: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}
      SOURCE_REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OPA (pinned + SHA-verified)
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          echo "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa

      # cosign >= 2.6.0 is required: `attest-blob --statement <self-built in-toto Statement>`
      # (so the subject is exactly the firmware digest D) and `--new-bundle-format` both land in 2.6.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.0

      # SLSA Build L2: GitHub's attestation store generates AND signs the provenance from the run's own
      # metadata, so the tenant workflow cannot forge the predicate content. This is the distinction that a
      # self-signed predicate (SLSA L1) cannot make: authenticity of the provenance itself, not just the
      # signature. Requires the attestation store, i.e. a public repo (or GitHub Enterprise).
      - name: Generate SLSA build provenance for the SBOM (platform-generated, SLSA L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: inputs/sbom.cdx.json

      - name: Verify the SLSA provenance (hard gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify inputs/sbom.cdx.json --repo "${{ github.repository }}"
          echo "✓ SLSA build provenance verified (platform-generated by GitHub — SLSA Build L2)"

      # The firmware image digest D — the anchor the whole evidence graph roots at. It is the
      # SBOM's own metadata.component SHA-256 (the digest of the firmware bytes the build shipped).
      # Every image-scoped attestation below is subjected to D via a self-built in-toto Statement.
      - name: Derive the firmware image digest D (evidence-graph anchor)
        id: anchor
        run: |
          D="$(jq -r '.metadata.component.hashes[]? | select(.alg=="SHA-256") | .content' inputs/sbom.cdx.json)"
          [ -n "$D" ] || { echo "no SHA-256 in metadata.component — cannot anchor" >&2; exit 1; }
          echo "d=$D" >> "$GITHUB_OUTPUT"
          echo "✓ firmware image digest D = sha256:$D"

      # Reconcile/byte-integrity attestation (subject = D). attest-blob --statement signs the
      # self-built Statement AS-IS so the subject is exactly D (never --type custom, which would
      # re-wrap the predicate and rewrite the subject to the blob's own digest). LEGACY bundle
      # format on purpose: the shared assembler decodes this DSSE payload directly to read BOTH
      # subjects (firmware D + bound SBOM-file H) + the reconcile predicate, and it expects the
      # legacy .base64Signature shape.
      - name: Keyless attest the reconcile verdict (subjects = firmware D + SBOM-file H)
        run: |
          # Multi-subject Statement: subject #1 firmware-image=D (evidence-graph binding),
          # subject #2 sbom.cdx.json=H (SBOM-file tamper-after-signing binding — this is the H the
          # assembler surfaces as attestation.file_subject, matched against sbom.hash).
          ./producers/wrap.sh inputs/reconcile-verdict.json "$PRED_TYPE" "${{ steps.anchor.outputs.d }}" \
            inputs/sbom.cdx.json sbom.cdx.json > inputs/reconcile.intoto.json
          cosign attest-blob --yes \
            --statement inputs/reconcile.intoto.json \
            --bundle inputs/sbom.att.bundle

      - name: Keyless verify the attestation
        id: verify
        run: |
          # --check-claims=false: the subject is the firmware image D, whose bytes are not present
          # in CI (no built .fd — see DEV_ASSUME_FWIMAGE). Signature + keyless identity are still
          # fully verified; a deploy-time verifier holding the real .fd checks the subject-digest claim.
          if cosign verify-blob-attestation \
              --certificate-identity "$BUILDER_ID" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --type "$PRED_TYPE" \
              --check-claims=false \
              --bundle inputs/sbom.att.bundle; then
            echo "sig=true"  >> "$GITHUB_OUTPUT"
          else
            echo "sig=false" >> "$GITHUB_OUTPUT"
          fi

      # SECURITY: byte-integrity + binary-hardening were the ONLY image-derived verdicts NOT wrapped
      # in a signed, firmware-D-anchored attestation — so an attacker with inputs/ write access but no
      # signing key could rewrite byte-integrity.json to modified:0 for a trojaned image and the gate
      # believed it. Sign them the SAME way as reconcile: a MULTI-SUBJECT Statement (subject #1
      # firmware-image=D, subject #2 the verdict file's own H), attest-blob --statement signs it AS-IS.
      # LEGACY bundle format on purpose (NO --new-bundle-format), exactly like the reconcile bundle: the
      # shared assembler decodes this DSSE payload directly to read subject #1 (firmware D) + the verdict
      # predicate, and reads the verdict FROM the signed bundle — never the loose inputs/*.json.
      - name: Keyless attest byte-integrity + binary-hardening (subjects = firmware D + file H)
        run: |
          D="${{ steps.anchor.outputs.d }}"
          BI_TYPE=https://firmware-sbom-supplychain/byte-integrity/v1
          BH_TYPE=https://firmware-sbom-supplychain/binary-hardening/v1

          ./producers/wrap.sh inputs/byte-integrity.json "$BI_TYPE" "$D" \
            inputs/byte-integrity.json byte-integrity.json > inputs/byte-integrity.intoto.json
          cosign attest-blob --yes \
            --statement inputs/byte-integrity.intoto.json \
            --bundle inputs/byte-integrity.att.bundle

          ./producers/wrap.sh inputs/binary-hardening.json "$BH_TYPE" "$D" \
            inputs/binary-hardening.json binary-hardening.json > inputs/binary-hardening.intoto.json
          cosign attest-blob --yes \
            --statement inputs/binary-hardening.intoto.json \
            --bundle inputs/binary-hardening.att.bundle

          # Standalone verifies (no `&&`) so a tampered bundle exits non-zero and FAILS the pipeline.
          # --check-claims=false: subject #1 is the firmware image D, whose bytes are not present in CI
          # (see DEV_ASSUME_FWIMAGE) — signature + keyless identity are still fully verified.
          cosign verify-blob-attestation \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type "$BI_TYPE" \
            --check-claims=false --bundle inputs/byte-integrity.att.bundle
          echo "✓ verified inputs/byte-integrity.att.bundle (subjects: firmware D + file H)"
          cosign verify-blob-attestation \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type "$BH_TYPE" \
            --check-claims=false --bundle inputs/binary-hardening.att.bundle
          echo "✓ verified inputs/binary-hardening.att.bundle (subjects: firmware D + file H)"

      # E1 (SBOM) + E4 (VEX) + E10 (CHIPSEC): wrap each as a MULTI-SUBJECT DSSE in-toto attestation
      # — subject #1 firmware-image=D (the shared evidence-graph anchor), subject #2 = that evidence
      # file's own digest H (tamper-after-signing). --new-bundle-format (Sigstore bundle) — these are
      # consumed by verifiers, not by the legacy-format assembler decode.
      - name: Wrap + keyless-attest the evidence graph (SBOM / VEX / CHIPSEC), subjects = D + file H
        run: |
          D="${{ steps.anchor.outputs.d }}"

          # E1 — CycloneDX SBOM (predicateType matches the emitter: cyclonedx.org/bom); file subject = the SBOM
          ./producers/wrap.sh inputs/sbom.cdx.json https://cyclonedx.org/bom "$D" \
            inputs/sbom.cdx.json sbom.cdx.json > inputs/sbom.intoto.json
          cosign attest-blob --yes --new-bundle-format \
            --statement inputs/sbom.intoto.json --bundle inputs/sbom.cdx.att.bundle

          # E4 — CVE triage: OpenVEX is the signed evidence; the BSI CSAF view is COLLAPSED into a
          # reference inside this one predicate (no second VEX attestation). File subject = the OpenVEX doc.
          python3 producers/interop/to-csaf.py inputs/vex.openvex.json -o inputs/vex.csaf.json
          CSAF_D="$(sha256sum inputs/vex.csaf.json | cut -d' ' -f1)"
          jq --arg d "$CSAF_D" '. + {"references":[{"type":"csaf","path":"inputs/vex.csaf.json","digest":{"sha256":$d}}]}' \
            inputs/vex.openvex.json > inputs/vex.pred.json
          ./producers/wrap.sh inputs/vex.pred.json https://openvex.dev/ns "$D" \
            inputs/vex.openvex.json vex.openvex.json > inputs/vex.intoto.json
          cosign attest-blob --yes --new-bundle-format \
            --statement inputs/vex.intoto.json --bundle inputs/vex.att.bundle

          # E10 — CHIPSEC posture: sign the REAL committed inputs/chipsec.json (produced from the
          # actual OVMF varstore by producers/chipsec/secureboot-from-varstore.py — secureboot is a
          # real offline varstore read; HW-rooted checks are honestly NOTAPPLICABLE on QEMU). We do
          # NOT regenerate it from a hand-authored sample. On the demo OVMF every module is
          # NOTAPPLICABLE (Secure Boot not provisioned), so the gate emits the chipsec reports as
          # advisory-ABSENT — the signed posture bundle records that true state.
          CHIPSEC_PT="$(jq -r .predicateType inputs/chipsec.json)"
          ./producers/wrap.sh inputs/chipsec.json "$CHIPSEC_PT" "$D" \
            inputs/chipsec.json chipsec-posture > inputs/chipsec.intoto.json
          cosign attest-blob --yes --new-bundle-format \
            --statement inputs/chipsec.intoto.json --bundle inputs/chipsec.att.bundle

          for b in sbom.cdx.att.bundle vex.att.bundle chipsec.att.bundle; do
            cosign verify-blob-attestation \
              --certificate-identity "$BUILDER_ID" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --check-claims=false --new-bundle-format --bundle "inputs/$b" \
              && echo "✓ verified inputs/$b (subjects: firmware D + file H)"
          done

      - name: CVE scan (grype via anchore/scan-action)   # F1 + idiomatic action
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: inputs/sbom.cdx.json
          output-format: json
          fail-build: false
          severity-cutoff: critical

      - name: Collect scan results
        run: cp "${{ steps.scan.outputs.json }}" inputs/grype.json

      # Build-tools SBOM: inventory the CI toolchain (SHA-pinned actions + tool versions) and keyless-sign it,
      # so the *build* supply chain is signed evidence too — not just the firmware product SBOM. Produced +
      # verified BEFORE the gate so `build-tools-signed` (SSDF PO.3.2 / S2C2F REB-3) can consume it as a fact.
      - name: Build-tools SBOM (inventory + keyless-attest the CI toolchain, subject = D)
        run: |
          ./producers/build-tools/build-tools-sbom.sh inputs/build-tools.cdx.json
          # E7 is now a MULTI-SUBJECT DSSE in-toto attestation (firmware D + build-tools file H,
          # predicateType cyclonedx.org/bom) rather than a detached sign-blob — so the build toolchain
          # evidence shares the firmware anchor while keeping its own file-integrity subject.
          ./producers/wrap.sh inputs/build-tools.cdx.json https://cyclonedx.org/bom "${{ steps.anchor.outputs.d }}" \
            inputs/build-tools.cdx.json build-tools.cdx.json > inputs/build-tools.intoto.json
          cosign attest-blob --yes --new-bundle-format \
            --statement inputs/build-tools.intoto.json --bundle inputs/build-tools.att.bundle
          cosign verify-blob-attestation \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type https://cyclonedx.org/bom \
            --check-claims=false --new-bundle-format --bundle inputs/build-tools.att.bundle
          echo "✓ CI toolchain inventoried ($(jq '.components|length' inputs/build-tools.cdx.json) components) + keyless-attested (subject=D)"

      - name: Assemble gate input from verified evidence, then gate
        run: |
          SBOM=inputs/sbom.cdx.json \
          BUNDLE=inputs/sbom.att.bundle \
          SIG=${{ steps.verify.outputs.sig }} \
          BUILDER_ID="$BUILDER_ID" SOURCE_REPO="$SOURCE_REPO" \
          SLSA_VERIFIED=true \
          CHIPSEC_JSON=inputs/chipsec.json \
          REQUIRE_SIGNED_EVIDENCE=1 \
          BYTE_INTEGRITY_BUNDLE=inputs/byte-integrity.att.bundle \
          BINARY_HARDENING_BUNDLE=inputs/binary-hardening.att.bundle \
          BYTE_INTEGRITY_JSON=inputs/byte-integrity.json \
          BINARY_HARDENING_JSON=inputs/binary-hardening.json \
          BUILD_TOOLS_JSON=inputs/build-tools.cdx.json BUILD_TOOLS_SIG=true \
          PROVENANCE_SUBJECT="sha256:$(sha256sum inputs/sbom.cdx.json | cut -d' ' -f1)" \
          DEV_ASSUME_FWIMAGE=1 \
          GRYPE_JSON=inputs/grype.json OUT=inputs/gate-input.json \
          bash oss-lane/assemble-gate-input.sh
          echo "--- gate input ---"; jq '{sbom,attestation,signature,provenance,reconcile:{clean:.reconcile.clean},cve:{n:(.cve.findings|length)}}' inputs/gate-input.json
          VSA_OUT=inputs/vsa.intoto.json OPA=/usr/local/bin/opa ./oss-lane/gate.sh inputs/gate-input.json
          echo "--- VSA (signed gate verdict) ---"; jq '{result:.predicate.verificationResult, levels:.predicate.verifiedLevels, reports:[.predicate.verifierReports[]|{name,isSuccess,controls}]}' inputs/vsa.intoto.json

      - name: Framework coverage from the signed VSA (initiative layer)
        run: |
          pip install --quiet --require-hashes -r requirements.txt
          python3 oss-lane/verify-initiative.py --vsa inputs/vsa.intoto.json

      - name: Sign the gate verdict (SLSA VSA) keyless, with the evidence-graph inputAttestations
        run: |
          # Populate the VSA's inputAttestations[] — {uri,digest} for every signed evidence
          # attestation (the evidence graph rooted at D). The digests are only known now (after
          # each blob was signed), so they are injected here rather than by the offline gate.
          inputs_json="$(
            for b in sbom.cdx.att.bundle sbom.att.bundle vex.att.bundle chipsec.att.bundle build-tools.att.bundle byte-integrity.att.bundle binary-hardening.att.bundle; do
              [ -f "inputs/$b" ] || continue
              d="$(sha256sum "inputs/$b" | cut -d' ' -f1)"
              jq -n --arg u "inputs/$b" --arg d "$d" '{uri:$u, digest:{sha256:$d}}'
            done | jq -s '.'
          )"
          # File subject H for the VSA = the digest of the gate-emitted verdict (captured BEFORE the
          # inputAttestations injection below — a Statement cannot contain its own final digest, so
          # subject #2 pins the verdict content the gate produced).
          VSA_H="$(sha256sum inputs/vsa.intoto.json | cut -d' ' -f1)"
          jq --argjson ia "$inputs_json" --arg h "$VSA_H" '
              .predicate.inputAttestations = $ia
            | .subject += [{"name":"vsa.intoto.json","digest":{"sha256":$h}}]' \
            inputs/vsa.intoto.json > inputs/vsa.intoto.tmp && mv inputs/vsa.intoto.tmp inputs/vsa.intoto.json
          # E6: the VSA is already an in-toto Statement (subject #1 firmware-image=D) — attest-blob
          # --statement signs it AS-IS, now carrying subject #2 (the verdict's own digest H).
          cosign attest-blob --yes --new-bundle-format \
            --statement inputs/vsa.intoto.json --bundle inputs/vsa.att.bundle
          cosign verify-blob-attestation \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type https://slsa.dev/verification_summary/v1 \
            --check-claims=false --new-bundle-format --bundle inputs/vsa.att.bundle
          echo "✓ gate verdict signed + verified as a portable SLSA VSA (subject=D, inputAttestations populated)"

      - name: Fixture honesty tests + assembler + byte-integrity unit tests
        run: |
          pip install --quiet --require-hashes -r requirements.txt
          OPA=/usr/local/bin/opa ./tests/run.sh
          python3 tests/test_assemble.py
          python3 tests/test_byte_integrity.py
          python3 tests/test_reconcile.py
          python3 tests/test_chipsec.py
          python3 tests/test_interop.py
          python3 tests/test_initiatives_sync.py

      - name: In-pipeline negative test (F5) — a post-sign tamper must be blocked
        run: OPA=/usr/local/bin/opa ./tests/pipeline-negative.sh

      # Feature (b): cosign's NATIVE policy over an OCI attestation — complementary to the OPA gate above.
      # Uploads the SBOM to ghcr (no oras), keyless-attests the reconcile verdict, then verifies the
      # attestation AGAINST the rego policy in one cosign command. Proven locally (clean=pass / dirty=fail).
      - name: cosign-native OCI policy check (verify-attestation --policy)
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/${{ github.repository }}/sbom:${{ github.sha }}"
          cosign upload blob -f inputs/sbom.cdx.json "$REF"
          cosign attest --yes --predicate inputs/reconcile-verdict.json --type "$PRED_TYPE" "$REF"
          cosign verify-attestation \
            --certificate-identity "$BUILDER_ID" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type "$PRED_TYPE" \
            --policy oss-lane/policy/cosign-reconcile.rego "$REF"
          echo "✓ cosign-native policy verified the signed reconcile predicate over the OCI artifact"

  # Second lane: the same SBOM, signed + compliance-verified with Valint, keyless via the GitHub
  # workload identity (attest-default: sigstore-github) — just like cosign above.
  valint-lane:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Valint — keyless attest the firmware SBOM
        uses: scribe-security/action-bom@04f84e96b20055b18c9076fa78cb15a83de0b331 # v2.0.7
        with:
          target: file:inputs/sbom.cdx.json
          format: attest
          attest-default: sigstore-github
          scribe-disable: "true"

      - name: Valint — verify custom firmware-composition policy
        uses: scribe-security/action-verify@d6095e23f387d90e67792a44576127f750350886 # v2.0.7
        continue-on-error: true   # report mode: show the compliance run without gating the demo
        with:
          target: file:inputs/sbom.cdx.json
          input-format: attest-cyclonedx-json
          rule: valint-lane/policies/firmware-composition.yaml
          verbose: "2"
          scribe-disable: "true"

      - name: Valint — verify against a framework initiative (SLSA L2)
        uses: scribe-security/action-verify@d6095e23f387d90e67792a44576127f750350886 # v2.0.7
        continue-on-error: true
        with:
          target: file:inputs/sbom.cdx.json
          input-format: attest-cyclonedx-json
          initiative-name: slsa.l2
          verbose: "2"
          scribe-disable: "true"
